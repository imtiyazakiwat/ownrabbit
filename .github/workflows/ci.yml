name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main never are, so a deploy is never cut off half-way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @ownrabbit/worker build
      - run: pnpm --filter @ownrabbit/web build
        env:
          # Build-time only; routes read real env at request time.
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-web:
    name: Deploy web (Vercel production)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment only allows main and holds the Vercel secrets, so PR and fork runs can't read them.
    environment:
      name: production
      url: https://ownrabbit.vercel.app
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Check deploy credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is empty in the production environment"; exit 1; fi
          done
      # Build on Vercel, not here: the project's env vars are Sensitive, and `vercel pull` only gives CI
      # "[SENSITIVE]" placeholders, so a local `vercel build` bakes those in. The check job already proved
      # the build. The token goes through the env, never argv; Root Directory (apps/web) comes from the project.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # In CI the CLI may print a multi-line JSON result instead of a bare URL, and multi-line text
        # breaks GITHUB_OUTPUT. Pull out the deployment URL either way; a failed deploy exits non-zero first.
        run: |
          set -o pipefail
          vercel deploy --prod --yes | tee deploy.out
          url=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' deploy.out | grep -v '^https://ownrabbit\.vercel\.app$' | head -n 1)
          if [ -z "$url" ]; then echo "::error::No deployment URL in vercel output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        # Per-deployment URLs sit behind Vercel deployment protection (302 to login),
        # so check the public production alias. -f fails on HTTP errors.
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w "%{http_code}\n" https://ownrabbit.vercel.app/
